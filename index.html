<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>基金持仓追踪</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0d0f14;--card:#181a20;--card2:#1e2028;--input:#2a2d36;--text:#e8e8e8;--text2:#8a8d98;--accent:#f7a239;--red:#e74c3c;--green:#2ecc71;--redbg:rgba(231,76,60,.12);--greenbg:rgba(46,204,113,.12);--blue:#3498db;--border:#2a2d36;--shadow:0 2px 12px rgba(0,0,0,.4)}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.page{display:none;min-height:100vh;padding-bottom:70px}.page.active{display:block}
.hdr{position:sticky;top:0;z-index:100;background:var(--bg);padding:12px 16px;display:flex;align-items:center;border-bottom:1px solid var(--border)}
.hdr h1{font-size:18px;flex:1;text-align:center}.hdr .back{font-size:22px;cursor:pointer;padding:4px 8px}
.ov{padding:20px 16px;text-align:center}.ov .total{font-size:32px;font-weight:700}.ov .row{display:flex;justify-content:center;gap:24px;margin-top:12px}
.ov .item{text-align:center}.ov .lb{font-size:12px;color:var(--text2)}.ov .vl{font-size:18px;font-weight:600;margin-top:2px}
.fl{padding:0 12px 16px}
.fc{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.fc:active{transform:scale(.98)}
.fc .top{display:flex;justify-content:space-between;align-items:flex-start}
.fc .nm{font-size:16px;font-weight:600}.fc .cd{font-size:12px;color:var(--text2);margin-top:2px}
.fc .rt{text-align:right}.fc .pf{font-size:20px;font-weight:700}.fc .pr{font-size:13px;margin-top:2px}
.fc .mid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;padding:10px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.fc .mi{display:flex;flex-direction:column}.fc .mi .lb{font-size:11px;color:var(--text2)}.fc .mi .vl{font-size:13px;font-weight:500;margin-top:2px}
.fc .bt{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.fc .ni{font-size:12px;color:var(--text2)}
.fc .acts{display:flex;gap:6px}
.fc .bs{padding:4px 8px;border-radius:6px;font-size:11px;border:1px solid var(--border);background:0;color:var(--text);cursor:pointer;white-space:nowrap}
.fc .bs:active{background:var(--input)}
.bn{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100}
.bn .ni2{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;cursor:pointer;color:var(--text2);font-size:10px;gap:2px}
.bn .ni2.act{color:var(--accent)}.bn .ni2 svg{width:24px;height:24px}
.di{background:var(--card);padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-bottom:1px solid var(--border)}
.di .it{text-align:center}.di .it .lb{font-size:11px;color:var(--text2)}.di .it .vl{font-size:15px;font-weight:600;margin-top:4px}
.di .it .sb{font-size:11px;color:var(--text2);margin-top:2px}
.tbs{display:flex;background:var(--card);border-bottom:1px solid var(--border);position:sticky;top:44px;z-index:99}
.tbs .tb{flex:1;text-align:center;padding:12px 0;font-size:14px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent}
.tbs .tb.act{color:var(--accent);border-bottom-color:var(--accent)}
.tc{display:none;padding:16px}.tc.act{display:block}
.st{font-size:15px;font-weight:600;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.sl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.sg{display:inline-flex;align-items:center;gap:6px;background:var(--input);padding:6px 12px;border-radius:8px;font-size:13px}
.sg .rm{color:var(--text2);cursor:pointer;margin-left:4px;font-size:16px}
.as{display:flex;gap:8px;margin-bottom:16px}
.as input{flex:1;background:var(--input);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-size:13px}
.as button{padding:8px 16px;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px}
.sr{display:grid;grid-template-columns:2fr 1fr 1fr 1.2fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center;font-size:13px}
.sr.hd{color:var(--text2);font-size:11px}.sr .nm{font-weight:500}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px}
.b-new{background:var(--greenbg);color:var(--green)}.b-red{background:var(--redbg);color:var(--red)}.b-blue{background:rgba(52,152,219,.12);color:var(--blue)}
.cb{background:var(--card);border-radius:12px;padding:12px;margin-bottom:16px;box-shadow:var(--shadow)}.cb canvas{max-height:250px}
.tr{display:flex;gap:8px;margin-bottom:12px}
.tr button{flex:1;padding:6px 0;background:var(--input);border:1px solid var(--border);color:var(--text2);border-radius:6px;font-size:12px;cursor:pointer}
.tr button.act{background:var(--accent);color:#000;border-color:var(--accent)}
.sm{width:100%;border-collapse:collapse;font-size:13px}
.sm th,.sm td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border)}
.sm th{color:var(--text2);font-weight:500;font-size:12px}
.db{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;padding:8px 16px}
.db button{flex:1;padding:10px;background:var(--accent);color:#000;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;margin:0 3px}
.db .bo{background:0;border:1px solid var(--accent);color:var(--accent)}
.trr{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:4px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center;font-size:13px}
.trr.hd{color:var(--text2);font-size:11px}
.ty{padding:2px 8px;border-radius:4px;font-size:11px;display:inline-block}
.t-buy{background:var(--redbg);color:var(--red)}.t-sell{background:var(--greenbg);color:var(--green)}.t-sip{background:rgba(247,162,57,.15);color:var(--accent)}
.t-ti{background:rgba(52,152,219,.15);color:var(--blue)}.t-to{background:rgba(155,89,182,.15);color:#9b59b6}
.td2{color:var(--text2);cursor:pointer;font-size:16px;text-align:center}
.mo{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center}
.mo.sh{display:flex}
.md{background:var(--card2);border-radius:16px 16px 0 0;width:100%;max-width:500px;padding:20px;max-height:80vh;overflow-y:auto}
.md h3{margin-bottom:16px;font-size:16px}
.md .fg{margin-bottom:12px}.md label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.md input,.md select{width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px}
.md .br{display:flex;gap:8px;margin-top:16px}
.md .br button{flex:1;padding:12px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;border:none}
.md .bc{background:var(--accent);color:#000}.md .bx{background:var(--input);color:var(--text)}
.btn-row{display:flex;gap:8px;margin:16px 12px}
.btn-row button{flex:1;padding:14px;background:var(--card);border:1px dashed var(--border);border-radius:12px;color:var(--text2);font-size:14px;cursor:pointer;text-align:center}
.btn-row button:active{background:var(--card2)}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:30px 16px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:16px}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent)}
.upload-zone svg{width:48px;height:48px;opacity:.4;margin-bottom:8px}
.upload-zone p{color:var(--text2);font-size:13px}
.upload-zone input{display:none}
.ocr-preview{background:var(--input);border-radius:8px;padding:12px;margin-bottom:12px}
.ocr-preview img{max-width:100%;max-height:200px;border-radius:8px;margin-bottom:8px}
.ocr-status{text-align:center;padding:12px;color:var(--text2);font-size:13px}
.af-btn{width:100%;padding:10px;background:var(--input);border:1px solid var(--border);color:var(--text2);border-radius:8px;cursor:pointer;font-size:13px;margin-bottom:12px}
.af-btn:active{background:var(--accent);color:#000}
.dp{display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:12px}
.dp svg{width:80px;height:80px;opacity:.3}.dp p{color:var(--text2);font-size:16px}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:0}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
@media(min-width:500px){.fl{max-width:500px;margin:0 auto}}
.fl-wrap{background:var(--card);border-radius:12px;margin:0 12px 16px;overflow:hidden;box-shadow:var(--shadow)}
.fl-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s}
.fl-row:last-child{border-bottom:none}
.fl-row:active{background:var(--card2)}
.fl-left{flex:1;min-width:0}
.fl-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.fl-sub{font-size:12px;color:var(--text2);display:flex;gap:8px;align-items:center}
.fl-right{text-align:right;margin-left:12px;flex-shrink:0}
.fl-ret{font-size:15px;font-weight:600;margin-bottom:4px}
.fl-pct{font-size:12px}
.fl-more{padding:8px 4px 8px 12px;color:var(--text2);font-size:20px;cursor:pointer;flex-shrink:0;line-height:1}
.tr2{color:var(--red)}.tg2{color:var(--green)}.ta2{color:var(--accent)}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}

/* ===== Detail page top nav (养基宝 style) ===== */
.dnav{display:flex;align-items:center;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.dnav .nb{font-size:22px;cursor:pointer;padding:4px 10px;color:var(--text);user-select:none;transition:opacity .15s}
.dnav .nb:active{opacity:.5}
.dnav .nb.disabled{opacity:.25;pointer-events:none}
.dnav .nc{flex:1;text-align:center;overflow:hidden}
.dnav .nc .fn{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnav .nc .fc2{font-size:12px;color:var(--text2);margin-top:1px}
.dnav .srch{font-size:20px;cursor:pointer;padding:4px 10px;color:var(--text2)}

/* ===== Quick stats row (当日涨幅/近1年/持有人数排名) ===== */
.qs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-bottom:1px solid var(--border)}
.qs .qi{text-align:center;padding:10px 4px}
.qs .qi .lb{font-size:11px;color:var(--text2)}
.qs .qi .vl{font-size:16px;font-weight:700;margin-top:2px}

/* ===== 9-cell grid ===== */
.dg{background:var(--card);display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border)}
.dg .gi{text-align:center;padding:12px 6px;position:relative}
.dg .gi+.gi::before{content:'';position:absolute;left:0;top:15%;bottom:15%;width:1px;background:var(--border)}
.dg .gi .lb{font-size:11px;color:var(--text2)}
.dg .gi .vl{font-size:15px;font-weight:700;margin-top:4px}
.dg .gi .sb{font-size:11px;color:var(--text2);margin-top:2px}

/* ===== Sector tab top info ===== */
.si{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border);font-size:13px}
.si .dt{color:var(--text2)}
.si .sn{cursor:pointer;font-weight:600;display:flex;align-items:center;gap:4px}
.si .sn::after{content:'▼';font-size:10px;color:var(--text2)}
.si .ch{font-weight:600}
.si .ds{color:var(--text2);font-size:11px}

/* ===== Danmaku ===== */
.dk{position:relative}
.dk-box{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--border)}
.dk-box .dki{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#000;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
.dk-box .dki.off{background:var(--input);color:var(--text2)}
.dk-box input{flex:1;background:var(--input);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:16px;font-size:13px;outline:none}
.dk-box input::placeholder{color:var(--text2)}
.dk-box .vt{display:flex;gap:8px;flex-shrink:0}
.dk-box .vt .bu,.dk-box .vt .bd{padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer}
.dk-box .vt .bu{border:1px solid var(--red);color:var(--red)}
.dk-box .vt .bu:active,.dk-box .vt .bu.on{background:var(--redbg)}
.dk-box .vt .bd{border:1px solid var(--green);color:var(--green)}
.dk-box .vt .bd:active,.dk-box .vt .bd.on{background:var(--greenbg)}
.dk-item{position:absolute;white-space:nowrap;font-size:13px;font-weight:500;pointer-events:none;animation:dkAnim 8s linear forwards;text-shadow:0 0 4px rgba(0,0,0,.8);z-index:10}
@keyframes dkAnim{from{transform:translateX(0)}to{transform:translateX(calc(-100vw - 100%))}}

/* ===== Sector index labels ===== */
.sl-row{display:flex;align-items:center;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border);gap:8px;font-size:13px;cursor:pointer}
.sl-row .snm{flex:1;font-weight:500}
.sl-row .sch{font-weight:600}
.sl-row .arr{color:var(--text2);font-size:16px}
.sl-label{padding:8px 12px 4px;font-size:12px;color:var(--text2);background:var(--card)}

/* ===== Bottom nav (养基宝 style) ===== */
.db2{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:100;max-width:500px;margin:0 auto}
.db2 .di2{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;cursor:pointer;color:var(--text2);font-size:10px;gap:3px;transition:color .15s}
.db2 .di2:active{color:var(--accent)}
.db2 .di2 .ico{font-size:20px}

/* ===== Sector dropdown menu ===== */
.sec-dd{display:none;position:absolute;top:100%;left:0;right:0;background:var(--card2);border:1px solid var(--border);border-radius:0 0 8px 8px;z-index:10;max-height:200px;overflow-y:auto}
.sec-dd.sh{display:block}
.sec-dd .sd-item{padding:10px 16px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)}
.sec-dd .sd-item:last-child{border-bottom:none}
.sec-dd .sd-item:active{background:var(--input)}
.sec-dd .sd-item.act{color:var(--accent)}

/* ===== Feedback modal ===== */
.fb-ta{width:100%;min-height:100px;background:var(--input);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;resize:vertical;font-family:inherit}
</style>
</head>
<body>
<div id="pg-home" class="page active">
  <div class="hdr"><span style="width:36px"></span><h1>💰 基金持仓</h1><span style="font-size:20px;cursor:pointer;padding:4px 8px" onclick="showSettings()">⚙️</span></div>
  <div class="ov" id="ov">
    <div class="lb">总资产（元）</div>
    <div class="total" id="ta">--</div>
    <div class="row">
      <div class="item"><div class="lb">总收益</div><div class="vl" id="tp">--</div><div id="tpr">--</div></div>
      <div class="item"><div class="lb">今日收益</div><div class="vl" id="tdp">--</div><div id="tdpr">--</div></div>
    </div>
  </div>
  <div class="fl" id="fl"></div>
  <div class="btn-row">
    <button onclick="showAddFund()">+ 添加基金</button>
    <button onclick="showOcrImport()">📷 截图导入</button>
  </div>
  <div class="bn">
    <div class="ni2 act"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="18" rx="3"/><path d="M8 12h8M8 8h8M8 16h5"/></svg><span>持仓</span></div>
    <div class="ni2" onclick="showPg('dev')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg><span>自选</span></div>
    <div class="ni2" onclick="showPg('dev')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg><span>发现</span></div>
    <div class="ni2" onclick="showPg('dev')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>我的</span></div>
  </div>
</div>
<div id="pg-detail" class="page">
  <div class="dnav" id="dnav">
    <span class="nb" onclick="goHome()" title="返回">←</span>
    <span class="nb" id="navPrev" onclick="navFund(-1)" title="上一只">◄</span>
    <div class="nc" onclick="showSecDD()">
      <div class="fn" id="dnav-name">基金名称</div>
      <div class="fc2" id="dnav-code">------</div>
    </div>
    <span class="nb" id="navNext" onclick="navFund(1)" title="下一只">►</span>
    <span class="srch" title="搜索">🔍</span>
  </div>
  <div id="sec-dd" class="sec-dd"></div>
  <div class="qs" id="dqs">
    <div class="qi"><div class="lb">当日涨幅</div><div class="vl" id="qs-day">--</div></div>
    <div class="qi"><div class="lb">近1年</div><div class="vl" id="qs-1y">--</div></div>
    <div class="qi"><div class="lb">持有人数排名</div><div class="vl" id="qs-rank">--</div></div>
  </div>
  <div class="dg" id="dinfo"></div>
  <div class="tbs" id="dtabs">
    <div class="tb act" data-t="sec" onclick="swTab('sec')">关联板块</div>
    <div class="tb" data-t="perf" onclick="swTab('perf')">业绩走势</div>
    <div class="tb" data-t="mp" onclick="swTab('mp')">我的收益</div>
  </div>
  <div id="t-sec" class="tc act"></div>
  <div id="t-perf" class="tc"></div>
  <div id="t-mp" class="tc"></div>
  <div class="db2" id="dbottom">
    <div class="di2" onclick="showEditHold()"><span class="ico">✏️</span><span>修改持仓</span></div>
    <div class="di2" onclick="showFeedback()"><span class="ico">💬</span><span>反馈</span></div>
    <div class="di2" onclick="goTrades()"><span class="ico">📋</span><span>交易记录</span></div>
    <div class="di2" id="btnFav" onclick="delFund(curCode)"><span class="ico">⭐</span><span>删自选</span></div>
    <div class="di2" onclick="showMore()"><span class="ico">⋯</span><span>更多</span></div>
  </div>
</div>
<div id="pg-trades" class="page">
  <div class="hdr"><span class="back" onclick="goDetail()">←</span><h1 id="tt">交易记录</h1><span style="width:36px"></span></div>
  <div style="padding:16px" id="tl"></div>
</div>
<div id="pg-dev" class="page">
  <div class="hdr"><h1>开发中</h1></div>
  <div class="dp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg>
    <p>该功能开发中，敬请期待</p>
    <button onclick="goHome()" style="padding:10px 24px;background:var(--accent);color:#000;border:none;border-radius:8px;cursor:pointer">返回首页</button>
  </div>
</div>
<div class="mo" id="mo"><div class="md" id="mc"></div></div>
<script>
let curPg='home',curCode=null,curTab='sec',navTimer=null,intradayTimer=null,charts={};
const RAW_PROXY='https://api.allorigins.win/raw?url=';
const intradayCache={};

function ld(){try{const d=JSON.parse(localStorage.getItem('ft_data'));if(d&&d.funds)return d}catch(e){}return{funds:[]}}
function sv(d){localStorage.setItem('ft_data',JSON.stringify(d))}
function gf(c){return ld().funds.find(f=>f.code===c)}
function uf(c,fn){const d=ld();const i=d.funds.findIndex(f=>f.code===c);if(i>=0){fn(d.funds[i]);sv(d)}}
function fmt(n,d){return Number(n||0).toFixed(d||2)}

/* ===== Sina Real-time Quote ===== */
async function fetchSinaQuote(code){
  try{
    const url=`https://hq.sinajs.cn/rn=${Date.now()}&list=${code}`;
    const proxyUrl=RAW_PROXY+encodeURIComponent(url);
    const resp=await fetch(proxyUrl,{headers:{'Referer':'https://finance.sina.com.cn'}});
    const text=await resp.text();
    const match=text.match(/="([^"]+)"/);
    if(!match||!text.includes('"'))return null;
    const parts=match[1].split(',');
    if(parts.length<32)return null;
    const open=parseFloat(parts[1]),prevClose=parseFloat(parts[2]),current=parseFloat(parts[3]);
    return{name:parts[0],open,prevClose,current,high:parseFloat(parts[4]),low:parseFloat(parts[5]),date:parts[30],time:parts[31],chp:prevClose>0?((current-prevClose)/prevClose*100):0};
  }catch(e){console.warn('Sina fetch failed',code,e);return null}
}

/* ===== Eastmoney Intraday Fallback ===== */
async function fetchEMMinute(code){
  try{
    let secid=code;
    if(code.startsWith('sh'))secid='1.'+code.slice(2);
    else if(code.startsWith('sz'))secid='0.'+code.slice(2);
    const url=`https://push2.eastmoney.com/api/qt/stock/trends2/get?fields1=f1,f2,f3,f4,f5&fields2=f51,f52,f53,f54,f55,f56,f57,f58&ut=fa5fd1943c7b386f172d6893dbfba10b&ndays=1&secid=${secid}&_=${Date.now()}`;
    const resp=await fetch(RAW_PROXY+encodeURIComponent(url));
    const data=await resp.json();
    if(data&&data.data&&data.data.trends){
      const trends=data.data.trends,prev=parseFloat(data.data.prePrice);
      return{name:data.data.name,prev,data:trends.map(t=>{
        const p=t.split(',');return{t:p[0].trim().match(/\d{2}:\d{2}/)?.[0]||p[0],p:parseFloat(p[1])};
      })};
    }
  }catch(e){console.warn('EM minute failed',code,e)}
  return null;
}

async function updateIntraday(code){
  const sd=await fetchSinaQuote(code);
  if(sd){
    if(!intradayCache[code])intradayCache[code]={prev:sd.prevClose||sd.open,data:[],name:sd.name};
    const cache=intradayCache[code];
    cache.prev=cache.prev||sd.prevClose;
    const now=new Date(),ts=(now.getHours()<10?'0':'')+now.getHours()+':'+(now.getMinutes()<10?'0':'')+now.getMinutes();
    const idx=cache.data.findIndex(x=>x.t===ts);
    const pct=cache.prev>0?((sd.current-cache.prev)/cache.prev*100):0;
    if(idx>=0)cache.data[idx]={t:ts,p:sd.current,pct};
    else cache.data.push({t:ts,p:sd.current,pct});
    cache.name=sd.name;return cache;
  }
  const em=await fetchEMMinute(code);
  if(em&&em.data&&em.data.length>0){
    if(!intradayCache[code])intradayCache[code]={prev:em.prev,data:[],name:em.name};
    const cache=intradayCache[code];cache.prev=cache.prev||em.prev;cache.name=em.name;
    cache.data=em.data.map(d=>({t:d.t,p:d.p,pct:cache.prev>0?((d.p-cache.prev)/cache.prev*100):0}));
    return cache;
  }
  return null;
}

function startIntradayPoll(secs){
  if(intradayTimer)clearInterval(intradayTimer);
  if(secs&&secs.length>0){
    secs.forEach(async s=>{if(s.code)await updateIntraday(s.code)});
    renSecChart(secs);
    intradayTimer=setInterval(async()=>{
      const h=new Date().getHours();
      if(h>=9&&h<15){for(const s of secs){if(s.code)await updateIntraday(s.code)}renSecChart(secs)}
    },30000);
  }
}

  });

async function loadPerf(days,btn){
  if(btn){document.querySelectorAll('#t-perf .tr button').forEach(b=>b.classList.remove('act'));btn.classList.add('act')}
  const f=gf(curCode);if(!f)return;
  let hist=f.historyNav||[];
  if(!hist||hist.length===0){
    const rawList=await fHist(curCode,1,365);
    if(rawList&&rawList.length>0){
      hist=rawList.map(x=>({date:x.FSRQ||x.jzrq||'',nav:parseFloat(x.LJJZ||x.jz||0)})).filter(x=>x.date&&x.nav>0);
      uf(curCode,ff=>{ff.historyNav=hist});
    }
  }
  if(!hist||hist.length===0){
    const ps=document.getElementById('ps');if(ps)ps.innerHTML='<div style="text-align:center;padding:20px;color:var(--text2)">暂无历史净值数据，请检查基金代码</div>';
    return;
  }
  const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days);
  const fl=hist.filter(d=>new Date(d.date)>=cutoff).reverse();
  if(fl.length<2){document.getElementById('ps').innerHTML='<div style="text-align:center;padding:20px;color:var(--text2)">所选区间暂无数据</div>';return}
  const dates=fl.map(d=>d.date),navs=fl.map(d=>d.nav),s0=navs[0];
  const nn=navs.map(n=>(n-s0)/s0*100);
  const cv=document.getElementById('perf-chart');if(!cv)return;if(charts.perf)charts.perf.destroy();
  charts.perf=new Chart(cv.getContext('2d'),{type:'line',data:{labels:dates,datasets:[{label:f.name||f.code,data:nn,borderColor:'#f7a239',backgroundColor:'rgba(247,162,57,.1)',borderWidth:2,pointRadius:0,tension:.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8a8d98',font:{size:11}}},tooltip:{mode:'index',intersect:false}},scales:{x:{ticks:{color:'#8a8d98',maxTicksLimit:8,maxRotation:0},grid:{color:'rgba(255,255,255,.05)'}},y:{ticks:{color:'#8a8d98',callback:v=>fmt(v)+'%'},grid:{color:'rgba(255,255,255,.05)'}}}}});
  const la=navs[navs.length-1],tr2=(la-s0)/s0*100,mx=Math.max(...navs),mn=Math.min(...navs);
  document.getElementById('ps').innerHTML=`<table class="sm mt8"><tr><th>区间收益率</th><td class="${cc(tr2)}">${fp(tr2)}</td></tr><tr><th>最大净值</th><td>${fmt(mx)}</td></tr><tr><th>最小净值</th><td>${fmt(mn)}</td></tr><tr><th>最大回撤</th><td class="tr2">${fmt((mx-mn)/mx*100)}%</td></tr><tr><th>数据点数</th><td>${fl.length}</td></tr></table>`;
}

  ['国泰君安','020001'],
];

async function searchFundCode(name){
  // 1. 先查本地映射表（关键词模糊匹配）
  for(const [kw,code] of FUND_CODE_MAP){
    if(name.includes(kw)) return code;
  }
  // 2. 再走网络搜索
  try{
    const url=`https://fundsuggest.eastmoney.com/FundSearch/api/FundSearchAPI.ashx?callback=jQuery&m=1&key=${encodeURIComponent(name)}&_=${Date.now()}`;
    const proxyUrl=`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    const resp=await fetch(proxyUrl,{signal:AbortSignal.timeout(5000)});
    const text=await resp.text();
    const match=text.match(/jQuery\w*\((\{.*?\})\)/s);
    if(match){
      const data=JSON.parse(match[1]);
      if(data.Datas&&data.Datas.length>0) return data.Datas[0].CODE;
    }
  }catch(e){console.warn('searchFundCode failed',name,e)}
  return null;
}

// 免费 Gemini API Key（Google 免费额度，每天1500次）
const GEMINI_KEY=''; // 在设置中填入你的 Gemini API Key

async function startAiRecognition(){
  if(!ocrImageData){alert('请先上传图片');return}

  const statusEl=document.getElementById('ocr-status');
  const resultEl=document.getElementById('ocr-result');
  const importBtn=document.getElementById('ocr-import-all');
  const aiBtn=document.getElementById('ocr-ai-btn');
  if(statusEl){statusEl.style.display='block';statusEl.innerHTML='<div>⏳ 识别中，请稍候...</div>'}
  if(resultEl)resultEl.style.display='none';
  if(importBtn)importBtn.style.display='none';
  if(aiBtn)aiBtn.disabled=true;

  const base64Data=ocrImageData.split(',')[1];
  const mimeType=ocrImageData.split(',')[0].match(/data:(.*?);/)?.[1]||'image/jpeg';

  const prompt=`请仔细识别这张支付宝基金持仓截图，提取所有基金的完整信息。
要求：
1. name必须是基金完整全称，不能截断（如"南方纳斯达克100指数(QDII)C"）
2. 如果能看到基金代码（6位数字），填入code字段
返回纯JSON数组，格式：[{"name":"基金完整全称","code":"代码或空","amount":持有金额数字,"dayReturn":日收益数字,"holdReturn":持有收益数字}]
只返回JSON数组，不要任何其他文字。`;

  // 优先用用户自己配置的接口，否则用 Gemini 免费接口
  const cfg=getAiConfig();
  let content='';

  try{
    const geminiKey=(cfg?.geminiKey&&cfg.geminiKey.startsWith('AIza'))?cfg.geminiKey:'';
    const hasCustom=cfg&&cfg.key&&cfg.key.length>10&&cfg.endpoint&&cfg.endpoint.startsWith('http');
    const hasAliyun=cfg?.aliyunKey&&cfg.aliyunKey.length>5;
    if(geminiKey){
      // 优先用 Gemini（免费）
      const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${geminiKey}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:mimeType,data:base64Data}}]}],generationConfig:{temperature:0.1,maxOutputTokens:2000}})
      });
      if(!resp.ok){const e=await resp.text();throw new Error('Gemini: '+e)}
      const d=await resp.json();
      content=d.candidates?.[0]?.content?.parts?.[0]?.text||'';
    } else if(hasCustom){
      // 用户自己配置的接口（OpenAI 兼容格式）
      const resp=await fetch(cfg.endpoint.replace(/\/+$/,'')+'/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model,messages:[{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url:ocrImageData}}]}],max_tokens:2000,temperature:0.1})
      });
      if(!resp.ok){const e=await resp.text();throw new Error('自定义接口: '+e)}
      const d=await resp.json();
      content=d.choices?.[0]?.message?.content||'';
    } else if(hasAliyun){
      // 阿里云通义千问VL
      const resp=await fetch('https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.aliyunKey},
        body:JSON.stringify({model:'qwen-vl-plus',messages:[{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url:ocrImageData}}]}],max_tokens:2000,temperature:0.1})
      });
      if(!resp.ok){const e=await resp.text();throw new Error('阿里云: '+e)}
      const d=await resp.json();
      content=d.choices?.[0]?.message?.content||'';
    } else {
      // 无可用配置
      throw new Error('请先在设置(⚙️)中填入 Gemini API Key 或 阿里云 API Key\nGemini: aistudio.google.com/apikey（免费）\n阿里云: dashscope.console.aliyun.com（免费额度）');
    }

    // Extract JSON
    const jsonMatch=content.match(/\[[\s\S]*\]/);
    if(jsonMatch) content=jsonMatch[0];

    const funds=JSON.parse(content);
    if(!Array.isArray(funds)||funds.length===0) throw new Error('未能识别到基金信息');

    ocrResults=funds.map(f=>({
      name:f.name||'',
      code:f.code||'',
      codeStatus:f.code?'found':'searching',
      amount:f.amount||0,
      dayReturn:f.dayReturn||0,
      holdReturn:f.holdReturn||0,
      ratio:f.ratio||''
    }));

    // Update status
    if(statusEl)statusEl.innerHTML=`<div>✅ 识别到 ${funds.length} 只基金，正在匹配基金代码...</div>`;

    // Render table first for fast feedback
    renderOcrTable();
    if(resultEl)resultEl.style.display='block';

    // 并行搜索代码（本地映射表直接命中，无需等待）
    const searchPromises=ocrResults.map(async(fund,idx)=>{
      if(!fund.code && fund.name){
        const code=await searchFundCode(fund.name);
        ocrResults[idx].code=code||'';
        ocrResults[idx].codeStatus=code?'found':'not_found';
      } else if(fund.code){
        ocrResults[idx].codeStatus='found';
      }
      updateOcrRow(idx);
    });
    await Promise.all(searchPromises);

    if(statusEl)statusEl.innerHTML=`<div>✅ 识别完成，共 ${ocrResults.length} 只基金</div>`;
    if(importBtn){importBtn.style.display='block';importBtn.textContent=`全部导入 (${ocrResults.length})`}

  }catch(e){
    console.error('AI recognition error:',e);
    if(statusEl)statusEl.innerHTML=`<div style="color:var(--red)">❌ 识别失败: ${eh(e.message)}</div>`;
  }finally{
    if(aiBtn)aiBtn.disabled=false;
  }
}

function renderOcrTable(){
  const tbody=document.getElementById('ocr-tbody');
  if(!tbody)return;
  tbody.innerHTML=ocrResults.map((f,i)=>`
<tr id="ocr-row-${i}" style="border-bottom:1px solid var(--border)">
  <td style="padding:8px 4px"><input value="${eh(f.name)}" style="width:100%;background:var(--input);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:4px;font-size:12px" onchange="ocrResults[${i}].name=this.value" /></td>
  <td style="padding:8px 4px;min-width:70px"><span id="ocr-code-${i}" style="font-size:12px">${f.code?f.code:'搜索中...'}</span></td>
  <td style="padding:8px 4px;text-align:center"><input type="number" value="${f.amount}" style="width:80px;background:var(--input);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:4px;font-size:12px;text-align:center" onchange="ocrResults[${i}].amount=parseFloat(this.value)||0" /></td>
  <td style="padding:8px 4px;text-align:center"><input type="number" value="${f.dayReturn}" style="width:70px;background:var(--input);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:4px;font-size:12px;text-align:center" onchange="ocrResults[${i}].dayReturn=parseFloat(this.value)||0" /></td>
  <td style="padding:8px 4px;text-align:center"><input type="number" value="${f.holdReturn}" style="width:70px;background:var(--input);border:1px solid var(--border);color:var(--text);padding:4px 6px;border-radius:4px;font-size:12px;text-align:center" onchange="ocrResults[${i}].holdReturn=parseFloat(this.value)||0" /></td>
  <td style="padding:8px 4px;text-align:center"><span style="cursor:pointer;font-size:16px" onclick="removeOcrRow(${i})">🗑</span></td>
</tr>`).join('');
}

function updateOcrRow(idx){
  const codeEl=document.getElementById('ocr-code-'+idx);
  if(codeEl){
    const f=ocrResults[idx];
    if(f.codeStatus==='found'){
      codeEl.textContent=f.code;
      codeEl.style.color='var(--green)';
    }else if(f.codeStatus==='not_found'){
      codeEl.textContent='未找到';
      codeEl.style.color='var(--red)';
    }else{
      codeEl.textContent='搜索中...';
      codeEl.style.color='var(--text2)';
    }
  }
}

function removeOcrRow(idx){
  ocrResults.splice(idx,1);
  renderOcrTable();
  const importBtn=document.getElementById('ocr-import-all');
  if(importBtn){importBtn.textContent=`全部导入 (${ocrResults.length})`}
  if(ocrResults.length===0){
    const resultEl=document.getElementById('ocr-result');
    if(resultEl)resultEl.style.display='none';
    if(importBtn)importBtn.style.display='none';
  }
}

async function importAllOcr(){
  if(!ocrResults.length)return;
  const statusEl=document.getElementById('ocr-status');
  const importBtn=document.getElementById('ocr-import-all');
  if(importBtn){importBtn.disabled=true;importBtn.textContent='导入中...'}
  if(statusEl)statusEl.innerHTML='<div>⏳ 正在导入...</div>';

  let imported=0,skipped=0;
  const data=ld();

  for(const fund of ocrResults){
    if(!fund.name&&!fund.code)continue;

    let code=fund.code;
    let name=fund.name;

    // If no code, try to find it
    if(!code&&name){
      code=await searchFundCode(name);
    }

    // If still no code, try to fetch from name via fNav
    if(!code){
      // Use name as-is, user can edit later
      code=null;
    }

    // Check if fund already exists
    if(code&&data.funds.find(f=>f.code===code)){
      skipped++;
      continue;
    }

    // If we have a code, verify name via fNav
    if(code){
      try{
        const navData=await fNav(code);
        if(navData){
          name=navData.name||name;
        }
      }catch(e){}
    }

    if(!code){
      // Generate a temporary code from name hash
      code='tmp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,6);
    }

    const costNav=fund.amount>0&&fund.holdReturn!==undefined?fund.amount/(fund.amount+fund.holdReturn)*1:1;
    const shares=fund.amount>0?fund.amount/Math.max(costNav,0.0001):0;

    data.funds.push({
      code,
      name:name||code,
      shares:shares,
      cost:costNav,
      addDate:td(),
      investAmount:fund.amount,
      trades:[{id:uid(),date:td(),type:'buy',shares,price:costNav,amount:fund.amount}],
      relatedSectors:[],
      holdings:[],
      nav:null,gsz:null,gztime:null,navDate:null,gszzl:null,historyNav:[]
    });

    imported++;
    if(statusEl)statusEl.innerHTML=`<div>⏳ 已导入 ${imported}/${ocrResults.length}...</div>`;
  }

  sv(data);

  if(statusEl)statusEl.innerHTML=`<div style="color:var(--green)">✅ 导入完成！成功 ${imported} 只${skipped>0?'，跳过 '+skipped+' 只已存在的':''}</div>`;

/* ===== OCR Tab Switching & Text Paste Parsing ===== */
function switchOcrTab(tab){
  document.getElementById('ocr-panel-ai').style.display=tab==='ai'?'block':'none';
  document.getElementById('ocr-panel-txt').style.display=tab==='txt'?'block':'none';
  document.getElementById('ocr-tab-ai').style.background=tab==='ai'?'var(--accent)':'transparent';
  document.getElementById('ocr-tab-ai').style.color=tab==='ai'?'#000':'var(--text)';
  document.getElementById('ocr-tab-txt').style.background=tab==='txt'?'var(--accent)':'transparent';
  document.getElementById('ocr-tab-txt').style.color=tab==='txt'?'#000':'var(--text)';
}

function parseOcrText(text){
  const results=[];
  const lines=text.split('\n').map(l=>l.trim()).filter(l=>l);
  let i=0;
  while(i<lines.length){
    const line=lines[i];
    if(/[\u4e00-\u9fa5]{3,}/.test(line) && line.length>5 && !line.match(/^[\d\+\-¥元%]+$/)){
      const fund={name:line,amount:0,dayReturn:0,holdReturn:0};
      for(let j=i+1;j<Math.min(i+5,lines.length);j++){
        const nl=lines[j];
        const amtMatch=nl.match(/(?:持有金额|持有市值)[\s:：]*([0-9,]+\.?[0-9]*)/);
        if(amtMatch) fund.amount=parseFloat(amtMatch[1].replace(',',''));
        const pureAmt=nl.match(/^[¥￥]?([0-9,]+\.[0-9]{2})(?:元)?$/);
        if(pureAmt&&!fund.amount) fund.amount=parseFloat(pureAmt[1].replace(',',''));
        const dayMatch=nl.match(/(?:当日收益|今日收益)[\s:：]*([+-]?[0-9]+\.?[0-9]*)/);
        if(dayMatch) fund.dayReturn=parseFloat(dayMatch[1]);
        const holdMatch=nl.match(/(?:持有收益|累计收益)[\s:：]*([+-]?[0-9]+\.?[0-9]*)/);
        if(holdMatch) fund.holdReturn=parseFloat(holdMatch[1]);
        if(j>i&&/[\u4e00-\u9fa5]{3,}/.test(nl)&&nl.length>5&&!nl.match(/^[\d\+\-¥元%]+$/)) break;
      }
      if(fund.name&&(fund.amount>0||fund.dayReturn!==0||fund.holdReturn!==0)){
        results.push(fund);
        i+=3;
        continue;
      }
    }
    i++;
  }
  return results;
}

function parsePastedText(){
  const txt=document.getElementById('ocr-paste-txt').value.trim();
  if(!txt){alert('请先粘贴文字');return}
  const funds=parseOcrText(txt);
  if(!funds.length){
    alert('未能解析到基金信息，请确认格式是否正确');return;
  }
  ocrResults=funds.map(f=>({
    name:f.name,code:'',codeStatus:'searching',
    amount:f.amount,dayReturn:f.dayReturn,holdReturn:f.holdReturn,ratio:''
  }));
  const statusEl=document.getElementById('ocr-status');
  if(statusEl){statusEl.style.display='block';statusEl.innerHTML=`<div>✅ 解析到 ${funds.length} 只基金，正在搜索代码...</div>`}
  const resultEl=document.getElementById('ocr-result');
  const importBtn=document.getElementById('ocr-import-all');
  renderOcrTable();
  if(resultEl)resultEl.style.display='block';
  if(importBtn){importBtn.style.display='block';importBtn.textContent=`全部导入 (${ocrResults.length})`}
  ocrResults.forEach(async(fund,idx)=>{
    const code=await searchFundCode(fund.name);
    ocrResults[idx].code=code||'';
    ocrResults[idx].codeStatus=code?'found':'not_found';
    updateOcrRow(idx);
  });
}
